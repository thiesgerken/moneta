kind: pipeline
name: default

steps:
  - name: restore-cache
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      restore: true
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "target"
        - ".cargo"
    volumes:
      - name: cache
        path: /tmp/cache

  - name: test
    image: rust:1.64-bullseye
    commands:
      - export CARGO_HOME=$(pwd)/.cargo/
      - apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc clang
      - cargo test
    when:
      event:
        - pull_request
    depends_on:
      - restore-cache

  - name: rebuild-cache
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      rebuild: true
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "target"
        - ".cargo"
    volumes:
      - name: cache
        path: /tmp/cache
    depends_on:
      - test

  - name: build-docker-image
    image: plugins/docker
    settings:
      registry: git.gerken.haus
      repo: git.gerken.haus/thies/moneta
      tags:
        - ${DRONE_COMMIT_BRANCH}
      cache_from:
        - "git.gerken.haus/thies/moneta:${DRONE_COMMIT_BRANCH}"
      force_tag: true
      username: thies
      password:
        from_secret: gitea_token
    when:
      event:
        - push
      branch:
        - main
        - devel

volumes:
  - name: cache
    host:
      path: /var/lib/cache

trigger:
  ref:
    - refs/heads/main
    - refs/heads/devel
    - refs/pull/*/head
