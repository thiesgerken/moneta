name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt, clippy
          workspaces: backend

      - run: cd backend && cargo fmt --all -- --check
      - run: cd backend && cargo clippy --all-targets -- -D warnings
      - run: cd backend && cargo test

  test-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # uuidv7() as a column default needs 18
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moneta
          POSTGRES_PASSWORD: moneta
          POSTGRES_DB: moneta
        options: >-
          --health-cmd "pg_isready -U moneta"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install psql
        run: apt-get update -y && apt-get install -y --no-install-recommends postgresql-client

      # applies every migration to an empty database, then asserts that the rendered views and
      # the CHECK constraints still do what they claim
      - run: backend/tests/run-sql-tests.sh
        env:
          PGURL: postgres://moneta:moneta@postgres:5432/moneta

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - run: npm install -g pnpm

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # build first: it runs houdini codegen, which lint and check both need
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm check
      - run: cd frontend && pnpm lint

  # No `needs` on the test jobs, deliberately: this gitea never unblocks a job that has one.
  # A probe job depending on a single succeeded job stayed blocked just the same, so the
  # images would simply never be built. They are pushed from main and devel only, and both
  # are merged from pull requests that ran the tests, so the gate bought little. Put it back
  # once `needs` works again.
  #
  # Two steps rather than a matrix over the components, because checkout, buildx and the
  # registry login are shared. The rollout is in the same job for the same reason `needs` is
  # missing above: as a job of its own it would have nothing holding it behind the build, and
  # would restart the deployments onto the image the previous run pushed.
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Build and push the backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: true
          tags: gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-to: type=inline

      - name: Build and push the frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          push: true
          tags: gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-to: type=inline

      # devel builds an image but does not deploy; the cluster runs main.
      - name: Setup kubectl
        if: github.ref_name == 'main'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: "latest"

      - name: Configure kubectl
        if: github.ref_name == 'main'
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-moneta
          kubectl config use-context context

      # The deployments pull :main with imagePullPolicy Always, so a restart is what picks the
      # new image up. The periodic CronJob runs the backend image too, but it pulls on its own
      # next tick and there is nothing to restart.
      - name: Restart the deployments
        if: github.ref_name == 'main'
        run: |
          kubectl rollout restart deployment/backend deployment/frontend -n apps-moneta
          kubectl rollout status deployment/backend -n apps-moneta --timeout=300s
          kubectl rollout status deployment/frontend -n apps-moneta --timeout=300s
