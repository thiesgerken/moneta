  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc clang
          mkdir -p web/build
          touch web/build/index.html

      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          components: rustfmt, clippy

      - run: cd backend && cargo check
      # - run: cd backend && cargo test
      # - run: cd backend && cargo fmt --all -- --check
      # - run: cd backend && cargo clippy -- -D warnings
      # - run: cd backend && cargo build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - run: npm install -g pnpm

      - name: Install dependencies and test
        run: |
          cd frontend
          pnpm i
          pnpm build
