name: CI

on:
  push:
    branches:
      - main
    # A full run is half an hour of a single runner and ends in a deploy. None of that tells
    # anyone anything about a commit that only touched prose.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

# One run per branch: the runner takes one job at a time, so without this a series of pushes
# spends an hour testing commits nobody is waiting for any more. This does cancel a rollout
# that is already running, which is harmless -- the run that superseded it deploys the newer
# image anyway, and kubernetes finishes the restart whether or not anyone is watching it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          # llvm-tools is what cargo-llvm-cov needs to read the instrumented profiles
          components: rustfmt, clippy, llvm-tools-preview
          # `cache-workspaces`, not `workspaces`: the latter is not an input of this action,
          # so it was dropped silently and the cache step looked for a Cargo.toml in the repo
          # root, where there is none. It only surfaced when the save got far enough to run
          # `cargo metadata`, which failed the whole job from a post step.
          cache-workspaces: backend

      # a prebuilt binary; `cargo install cargo-llvm-cov` is a couple of minutes of compiling
      # a tool this job only calls once
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov

      - run: cd backend && cargo fmt --all -- --check
      - run: cd backend && cargo clippy --all-targets -- -D warnings

      # llvm-cov runs the tests, so this is `cargo test` with the profile turned on rather
      # than a second run of the suite. It fails the job on a failing test exactly as before.
      - name: Test with coverage
        run: cd backend && cargo llvm-cov --json --summary-only --output-path ../backend-coverage.json

      # v4 and not the current major: the artifact client bundled from v7 on refuses to run
      # against anything that is not github.com, and Gitea reads to it as a GHES instance --
      # "@actions/artifact v2.0.0+ ... are not currently supported on GHES", after the step has
      # already found the file. v4 talks to Gitea's artifact API and always has. renovate is
      # told to leave the major alone; the digest still moves.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend-coverage.json

  test-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # uuidv7() as a column default needs 18
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: moneta
          POSTGRES_PASSWORD: moneta
          POSTGRES_DB: moneta
        options: >-
          --health-cmd "pg_isready -U moneta"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install psql
        run: apt-get update -y && apt-get install -y --no-install-recommends postgresql-client

      # applies every migration to an empty database, then asserts that the rendered views and
      # the CHECK constraints still do what they claim
      - run: backend/tests/run-sql-tests.sh
        env:
          PGURL: postgres://moneta:moneta@postgres:5432/moneta

  # The per-user filters against a real database, which `cargo test` in test-backend cannot do
  # and deliberately does not try to: those are unit tests and stay unit tests.
  #
  # Its own postgres rather than test-schema's. That one applies the migrations and asserts
  # against a known set of fixtures; this one truncates and inserts its own. Sharing the
  # instance would mean each job's data was whatever the other left behind, and a failure would
  # depend on which finished first.
  test-scoping:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: moneta
          POSTGRES_PASSWORD: moneta
          POSTGRES_DB: moneta
        options: >-
          --health-cmd "pg_isready -U moneta"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache-workspaces: backend

      # the second variable turns a missing url from "skip" into a failure, so that a suite
      # which quietly tested nothing cannot report green
      - run: cd backend && cargo test --test scoping
        env:
          TEST_DATABASE_URL: postgres://moneta:moneta@postgres:5432/moneta
          MONETA_REQUIRE_DB_TESTS: "1"

      # Separate commands keep fixture truncation in the two suites strictly sequential.
      - run: cd backend && cargo test --test api_keys
        env:
          TEST_DATABASE_URL: postgres://moneta:moneta@postgres:5432/moneta
          MONETA_REQUIRE_DB_TESTS: "1"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@12.15.0

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # build first: it runs houdini codegen, which lint and check both need
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm check
      - run: cd frontend && pnpm lint

      # v8 coverage costs a few hundred milliseconds here, so it is always on rather than
      # being a second run of the same 23 tests
      - run: cd frontend && pnpm test --coverage

      # Named where it is uploaded from, not renamed on the way out: an artifact built from a
      # single path keeps only that file's basename, so uploading
      # `frontend/coverage/coverage-summary.json` lands as `coverage-summary.json` and the
      # directories are gone. The two artifacts unpack into one directory here, so each has to
      # arrive under a name that says which half it is.
      - run: cp frontend/coverage/coverage-summary.json frontend-coverage.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend-coverage.json

  # Reports where the branch stands to the pull request itself, editing its own comment on
  # every push rather than leaving one per push. Deliberately not a gate: there is no
  # threshold to fail against, and a number that blocks a merge is a number people work
  # around.
  #
  # It runs only when both test jobs are green, which is not a policy but a fact: llvm-cov
  # exits non-zero on a failing test and uploads nothing, so there would be no figure to
  # report anyway.
  #
  # Switched off: every comment edit triggers a notification mail, which on a PR with many
  # pushes is noise. Flip the condition back to `github.event_name == 'pull_request'` to
  # re-enable.
  coverage-comment:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage

      # The SQL suite has no coverage tool -- it is psql running assertions against a real
      # database -- so the comment carries its size instead of pretending it does not exist.
      - name: Count the SQL assertions
        # the labelled rows of the check tables, plus the rejection cases in constraints.sql
        run: echo "SQL_ASSERTIONS=$(grep -hoE "UNION ALL SELECT '|^ {8}\('" backend/tests/sql/*.sql | wc -l | tr -d ' ')" >> $GITHUB_ENV

      - name: Comment on the pull request
        run: node .gitea/coverage-comment.mjs
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_API: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Two steps rather than a matrix over the components, because checkout, buildx and the
  # registry login are shared. The rollout is in the same job as the build so that it cannot
  # restart the deployments onto an image this run did not push.
  build-and-deploy:
    needs: [test-backend, test-schema, test-scoping, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Build and push the backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-to: type=inline

      - name: Build and push the frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          # the context has no .git in it, so the commit is handed in rather than looked up
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-to: type=inline

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-moneta
          kubectl config use-context context

      # The deployments pull :main with imagePullPolicy Always, so a restart is what picks the
      # new image up. The periodic CronJob runs the backend image too, but it pulls on its own
      # next tick and there is nothing to restart.
      - name: Restart the deployments
        run: |
          kubectl rollout restart deployment/backend deployment/frontend -n apps-moneta
          kubectl rollout status deployment/backend -n apps-moneta --timeout=300s
          kubectl rollout status deployment/frontend -n apps-moneta --timeout=300s
