name: CI

on:
  push:
    branches:
      - main
    # A full run is half an hour of a single runner and ends in a deploy. None of that tells
    # anyone anything about a commit that only touched prose.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

# One run per branch: the runner takes one job at a time, so without this a series of pushes
# spends an hour testing commits nobody is waiting for any more. This does cancel a rollout
# that is already running, which is harmless -- the run that superseded it deploys the newer
# image anyway, and kubernetes finishes the restart whether or not anyone is watching it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          # `cache-workspaces`, not `workspaces`: the latter is not an input of this action,
          # so it was dropped silently and the cache step looked for a Cargo.toml in the repo
          # root, where there is none. It only surfaced when the save got far enough to run
          # `cargo metadata`, which failed the whole job from a post step.
          cache-workspaces: backend

      - run: cd backend && cargo fmt --all -- --check
      - run: cd backend && cargo clippy --all-targets -- -D warnings
      - run: cd backend && cargo test

  test-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # uuidv7() as a column default needs 18
        image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        env:
          POSTGRES_USER: moneta
          POSTGRES_PASSWORD: moneta
          POSTGRES_DB: moneta
        options: >-
          --health-cmd "pg_isready -U moneta"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install psql
        run: apt-get update -y && apt-get install -y --no-install-recommends postgresql-client

      # applies every migration to an empty database, then asserts that the rendered views and
      # the CHECK constraints still do what they claim
      - run: backend/tests/run-sql-tests.sh
        env:
          PGURL: postgres://moneta:moneta@postgres:5432/moneta

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm install -g pnpm

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # build first: it runs houdini codegen, which lint and check both need
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm check
      - run: cd frontend && pnpm lint

  # Two steps rather than a matrix over the components, because checkout, buildx and the
  # registry login are shared. The rollout is in the same job as the build so that it cannot
  # restart the deployments onto an image this run did not push.
  build-and-deploy:
    needs: [test-backend, test-schema, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Build and push the backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          tags: gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/backend:${{ github.ref_name }}
          cache-to: type=inline

      - name: Build and push the frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          tags: gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/moneta/frontend:${{ github.ref_name }}
          cache-to: type=inline

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-moneta
          kubectl config use-context context

      # The deployments pull :main with imagePullPolicy Always, so a restart is what picks the
      # new image up. The periodic CronJob runs the backend image too, but it pulls on its own
      # next tick and there is nothing to restart.
      - name: Restart the deployments
        run: |
          kubectl rollout restart deployment/backend deployment/frontend -n apps-moneta
          kubectl rollout status deployment/backend -n apps-moneta --timeout=300s
          kubectl rollout status deployment/frontend -n apps-moneta --timeout=300s
