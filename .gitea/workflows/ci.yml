name: CI

on:
  push:
    branches:
      - main
    # A full run is half an hour of a single runner and ends in a deploy. None of that tells
    # anyone anything about a commit that only touched prose.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

# One run per branch: the runner takes one job at a time, so without this a series of pushes
# spends an hour testing commits nobody is waiting for any more. This does cancel a rollout
# that is already running, which is harmless -- the run that superseded it deploys the newer
# image anyway, and kubernetes finishes the restart whether or not anyone is watching it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs that need a toolchain run on the nix runner inside the dev shell, so they test with
# exactly the Rust, node and Postgres a `nix develop` gives locally. They run directly on the
# runner host, whose Nix store is warm between runs.
jobs:
  test-backend:
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: cd backend && cargo fmt --all -- --check
      - run: cd backend && cargo clippy --all-targets -- -D warnings

      # llvm-cov runs the tests, so this is `cargo test` with the profile turned on rather
      # than a second run of the suite. It fails the job on a failing test exactly as before.
      - name: Test with coverage
        run: cd backend && cargo llvm-cov --json --summary-only --output-path ../backend-coverage.json

      # v4 and not the current major: the artifact client bundled from v7 on refuses to run
      # against anything that is not github.com, and Gitea reads to it as a GHES instance --
      # "@actions/artifact v2.0.0+ ... are not currently supported on GHES", after the step has
      # already found the file. v4 talks to Gitea's artifact API and always has. renovate is
      # told to leave the major alone; the digest still moves.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend-coverage.json

  # The SQL suite and the per-user filters against a real database, which `cargo test` in
  # test-backend cannot do and deliberately does not try to: those are unit tests and stay unit
  # tests.
  #
  # One server, but a database per suite. The SQL suite applies the migrations and asserts
  # against a known set of fixtures; the Rust suites truncate and insert their own. Sharing a
  # database would mean each suite's data was whatever the other left behind.
  test-database:
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Jobs on the runner host get no `services:` container. The dev shell's Postgres runs
      # inside the job instead, reachable only through a socket in its own temp dir, so
      # concurrent jobs can't collide on a port. PGDATA, PGHOST and PGUSER are what pg_ctl,
      # createdb and psql read, so the later steps need no flags to find it.
      #
      # The directory is under /tmp rather than mktemp's default, which is the TMPDIR of this
      # step's dev shell, and the server has to outlive the step. A short path also keeps the
      # socket under the length limit for unix sockets.
      - name: Start Postgres
        run: |
          # Servers of cancelled runs, which skip "Stop Postgres": no job outlives a few hours.
          for stale in $(find /tmp -maxdepth 1 -name 'moneta-postgres.*' -mmin +360); do
            pg_ctl --pgdata "$stale" --mode immediate stop || true
            rm -rf "$stale"
          done
          pg=$(mktemp -d /tmp/moneta-postgres.XXXXXX)
          export PGDATA="$pg" PGHOST="$pg" PGUSER=postgres
          printf 'PGDATA=%s\nPGHOST=%s\nPGUSER=%s\n' "$PGDATA" "$PGHOST" "$PGUSER" >> "$GITHUB_ENV"
          initdb --auth trust --username "$PGUSER" --no-sync >/dev/null
          pg_ctl --log "$pg/log" --options "-k $pg -c listen_addresses=''" --wait start
          createdb schema
          createdb scoping

      # applies every migration to an empty database, then asserts that the rendered views and
      # the CHECK constraints still do what they claim
      - run: PGURL="postgres:///schema?host=$PGHOST&user=$PGUSER" backend/tests/run-sql-tests.sh

      # The url is spelled out because the Rust client does not read PGHOST. The second
      # variable turns a missing url from "skip" into a failure, so that a suite which quietly
      # tested nothing cannot report green. Separate commands keep fixture truncation in the
      # suites strictly sequential.
      - name: Test the database-backed suites
        run: |
          export TEST_DATABASE_URL="postgres:///scoping?host=$PGHOST&user=$PGUSER" MONETA_REQUIRE_DB_TESTS=1
          cd backend
          cargo test --test scoping
          cargo test --test api_keys
          cargo test --test backup
          cargo test --test trusted_header
          cargo test --test expenses

      # A cancelled run skips this and leaves its Postgres behind; "Start Postgres" of a later run
      # sweeps it.
      - name: Stop Postgres
        if: always()
        run: pg_ctl --mode immediate stop && rm -rf "$PGDATA"

  test-frontend:
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: cd frontend && npm ci

      # build first: it runs houdini codegen, which lint and check both need
      - run: cd frontend && npm run build
      - run: cd frontend && npm run check
      - run: cd frontend && npm run lint

      # v8 coverage costs a few hundred milliseconds here, so it is always on rather than
      # being a second run of the same 23 tests
      - run: cd frontend && npm test -- --coverage

      # Named where it is uploaded from, not renamed on the way out: an artifact built from a
      # single path keeps only that file's basename, so uploading
      # `frontend/coverage/coverage-summary.json` lands as `coverage-summary.json` and the
      # directories are gone. The two artifacts unpack into one directory here, so each has to
      # arrive under a name that says which half it is.
      - run: cp frontend/coverage/coverage-summary.json frontend-coverage.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend-coverage.json

  # Reports where the branch stands to the pull request itself, editing its own comment on
  # every push rather than leaving one per push. Deliberately not a gate: there is no
  # threshold to fail against, and a number that blocks a merge is a number people work
  # around.
  #
  # It runs only when both test jobs are green, which is not a policy but a fact: llvm-cov
  # exits non-zero on a failing test and uploads nothing, so there would be no figure to
  # report anyway.
  #
  # Switched off: every comment edit triggers a notification mail, which on a PR with many
  # pushes is noise. Flip the condition back to `github.event_name == 'pull_request'` to
  # re-enable.
  coverage-comment:
    needs: [test-backend, test-frontend]
    runs-on: nix
    if: false
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage

      # The SQL suite has no coverage tool -- it is psql running assertions against a real
      # database -- so the comment carries its size instead of pretending it does not exist.
      - name: Count the SQL assertions
        # the labelled rows of the check tables, plus the rejection cases in constraints.sql
        run: echo "SQL_ASSERTIONS=$(grep -hoE "UNION ALL SELECT '|^ {8}\('" backend/tests/sql/*.sql | wc -l | tr -d ' ')" >> $GITHUB_ENV

      - name: Comment on the pull request
        run: node .gitea/coverage-comment.mjs
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_API: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Both images come from flake.nix, built with the toolchain the tests ran with. Built on pull
  # requests too, so a broken image shows up before the merge; pushed only once every test is
  # green.
  image:
    needs: [test-backend, test-database, test-frontend]
    runs-on: nix
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: nix build .#${{ matrix.component }}-image

      - name: Push image
        if: github.event_name == 'push'
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_GITEA }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          # The runner host has no /etc/containers/policy.json, and the policy only governs which
          # images skopeo accepts as a source, here our own fresh build.
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy "$@"; }
          skopeo login --username thies --password-stdin gitea.gerken.haus <<< "$REGISTRY_PASSWORD"
          ./result | skopeo copy docker-archive:/dev/stdin docker://gitea.gerken.haus/thies/moneta/${{ matrix.component }}:${{ github.ref_name }}

      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth.json"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: "v1.37.2"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-moneta
          kubectl config use-context context

      # The deployments pull :main with imagePullPolicy Always, so a restart is what picks the
      # new image up. The periodic CronJob runs the backend image too, but it pulls on its own
      # next tick and there is nothing to restart.
      - name: Restart the deployments
        run: |
          kubectl rollout restart deployment/backend deployment/frontend -n apps-moneta
          kubectl rollout status deployment/backend -n apps-moneta --timeout=300s
          kubectl rollout status deployment/frontend -n apps-moneta --timeout=300s
