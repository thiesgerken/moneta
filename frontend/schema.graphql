schema {
  query: Query
  mutation: Mutation
}

enum AccountAvailability {
  IMMEDIATELY
  DAYS
  WEEKS
  MONTHS
  YEARS
  DECADES
}

enum AccountKind {
  CASH
  DEBIT
  CREDIT
  DEBT
  STOCKS
  REAL_ESTATE
  VIRTUAL
  OTHER
}

enum AccountRisk {
  NONE
  SLIGHT
  LOW
  MEDIUM
  HIGH
  HUGE
}

enum AccountSortField {
  NAME
  KIND
  AVAILABILITY
  RISK
  OPENED
  CLOSED
}

enum AutomationRuleSortField {
  PRIORITY
  TITLE
  LAST_DELIVERY
}

enum BalanceSortField {
  DATE
  AMOUNT
  COMMENTS
  ACCOUNT
}

enum CategorySortField {
  NAME
  MONTHLY_LIMIT
}

"""
  Whose changes the activity feed shows. Filtered here rather than in the reader, which only
  ever holds a page: dropping a page's own entries would leave a handful of rows and call it
  everyone else's activity.
"""
enum ChangelogAuthor {
  ANYONE
  ME
  OTHERS
}

enum DeliverySortField {
  DATE
  AMOUNT
}

enum DeliveryStatus {
  "an expense was created" CREATED
  "already delivered before, so nothing was done" DUPLICATE
  "no automation rule matched; the line is remembered but produced no expense" UNMATCHED
  """
    a rule matched but could not be applied, and the line was *not* remembered so that
    fixing the rule and re-uploading picks it up
  """ FAILED
}

enum ExpenseSortField {
  ACCRUAL_START
  "earliest Wertstellung among the transactions" VALUE_DATE
  "earliest Buchungstag among the transactions that have one" BOOKING_DATE
  TITLE
  STORE
  DESCRIPTION
  COMMENTS
  EFFECTIVE_AMOUNT
  "template first, then the entries still needing attention" STATUS
  ACCOUNTS
  CATEGORIES
}

enum PeriodicInterval {
  DAILY
  WEEKLY
  MONTHLY
  YEARLY
}

enum PeriodicRuleSortField {
  TITLE
  PERIOD
  LAST_CREATION
}

"""
  Which way a list is ordered.

  Lists used to take a mongo sort document built in the browser (`{"accrualStart": -1}`) and
  a mongo filter document alongside it. Both are gone: the client now names a column from a
  per-entity enum and a direction, so nothing it sends can reach a column the resolver did
  not offer, and there is no query language to parse.
"""
enum SortDirection {
  ASC
  DESC
}

enum StatementEntryKind {
  "the computed balance the range opens on" OPENING
  EXPENSE
  "a balance that was actually recorded, which re-anchors the running total" BALANCE
}

input AccountInput {
  name: String!
  description: String!
  color: String
  iban: String
  kind: AccountKind!
  availability: AccountAvailability!
  risk: AccountRisk!
  opened: DateTime!
  closed: DateTime
  ownershipFraction: Float!
}

input AutomationRuleInput {
  title: String!
  templateId: UUID!
  priority: Int!
  regexTime: String
  regexStatement: String
  filterAmount: Int
  filterAccountId: UUID
}

input BalanceInput {
  "includes expenses with date < this value" date: DateTime!
  accountId: UUID!
  amount: Int!
  comments: String!
}

input CategoryInput {
  name: String!
  description: String!
  color: String
  parentId: UUID
  monthlyLimit: Int
}

input ExpenseCategorizationInput {
  categoryId: UUID!
  weight: Float!
}

"""
  A transaction handed to moneta from outside (a bank statement importer), before it is
  known which expense — if any — it belongs to.
"""
input ExpenseDelivery {
  accountId: UUID!
  "when the money moved (Wertstellung), which is the date everything is filed under" date: DateTime!
  """
    when the bank posted the line, where the statement says so. Kept on the transaction it
    produces, and used for nothing else: two statements of the same payment can disagree
    about it, so it must not decide what a thing cost or when.
  """ bookingDate: DateTime
  "in cents, using the same sign convention as expense transactions" amount: Int!
  statement: String!
}

"""
  The flag checkboxes above the expense table. Each one being off means "hide the expenses
  that carry this flag"; `normal` off means "show only expenses that carry some flag".
"""
input ExpenseFlagFilter {
  templates: Boolean!
  taxRelevant: Boolean!
  extraordinary: Boolean!
  unchecked: Boolean!
  incomplete: Boolean!
  normal: Boolean!
}

input ExpenseInput {
  title: String!
  store: String!
  description: String!
  comments: String!
  referenceAmount: Int
  accrualStart: DateTime!
  accrualEnd: DateTime!
  "set to true if this expense is only a stanza for a recurring expense; this means it will not be counted in any analysis" isTemplate: Boolean!
  "to track expenses that should be looked at again when preparing tax forms" isTaxRelevant: Boolean!
  "needs to be looked at by a user first (missing info, low confidence, ...)" isUnchecked: Boolean!
  "if we anticipate more transactions to appear before this can be completed; e.g. payback when a order hasn't arrived" isIncomplete: Boolean!
  "if this expense should not be considered for monthly spending and so on" isExtraordinary: Boolean!
  receipts: [ExpenseReceiptInput!]!
  categories: [ExpenseCategorizationInput!]!
  transactions: [ExpenseTransactionInput!]!
  positions: [ExpensePositionInput!]!
}

input ExpensePositionInput {
  amount: Int
  quantity: Float
  unit: String
  title: String!
  comments: String!
}

input ExpenseReceiptInput {
  uri: String!
  ocr: String
}

input ExpenseTransactionInput {
  accountId: UUID!
  "when the money moved (Wertstellung)" date: DateTime!
  "when the bank posted the line; only bank-delivered transactions have one" bookingDate: DateTime
  amount: Int
  fraction: Float
  comments: String!
  statement: String!
}

input PeriodicRuleInput {
  title: String!
  templateId: UUID!
  period: PeriodicInterval!
  titleReplacement: String
  amountReplacement: Int
  lastCreation: DateTime!
}

"""
  Combined date and time (with time zone) in [RFC 3339][0] format.

  Represents a description of an exact instant on the time-line (such as the
  instant that a user account was created).

  [`DateTime` scalar][1] compliant.

  See also [`chrono::DateTime`][2] for details.

  [0]: https://datatracker.ietf.org/doc/html/rfc3339#section-5
  [1]: https://graphql-scalars.dev/docs/scalars/date-time
  [2]: https://docs.rs/chrono/latest/chrono/struct.DateTime.html
"""
scalar DateTime

"""
  [Universally Unique Identifier][0] (UUID).

  [`UUID` scalar][1] compliant.

  See also [`uuid::Uuid`][2] for details.

  [0]: https://en.wikipedia.org/wiki/Universally_unique_identifier
  [1]: https://graphql-scalars.dev/docs/scalars/uuid
  [2]: https://docs.rs/uuid/*/uuid/struct.Uuid.html
"""
scalar UUID

type Account {
  id: UUID!
  owner: User!
  """
    How many transactions have been booked against this account in the last year, templates
    left out. What the pickers sort on: the five accounts you actually use are five of
    dozens, and alphabetical order buries them.
  """
  usageCount: Int!
  name: String!
  description: String!
  color: String
  iban: String
  kind: AccountKind!
  availability: AccountAvailability!
  risk: AccountRisk!
  opened: DateTime!
  closed: DateTime
  ownershipFraction: Float!
  synchronization: AccountSynchronization
}

type AccountMutation {
  delete(id: UUID!): Boolean!
  create(account: AccountInput!): Account!
  update(id: UUID!, account: AccountInput!): Boolean!
}

"One account's movement across a month."
type AccountOverview {
  account: Account!
  startAmount: Float!
  endAmount: Float!
  "`startAmount` plus the month's transactions — see [`MonthOverview::integrated_end_total`]"
  integratedEndAmount: Float
  income: Float!
  expenses: Float!
  expenseCount: Int!
}

type AccountQuery {
  list(limit: Int, skip: Int, search: String, onlyOpen: Boolean, sortBy: AccountSortField, sortDir: SortDirection): [Account!]!
  get(id: UUID!): Account!
}

"One account's balance at every sampled date, in the order [`History::dates`] gives them."
type AccountSeries {
  account: Account!
  amounts: [Float!]!
}

type AccountSynchronization {
  invert: Boolean!
  account: Account!
}

"""
  What a rule will make of the next delivery's Leistungszeitraum.

  All of it is read off the template rather than configured on the rule, so without somewhere
  to show it the behaviour would be invisible — and a template whose own period is a day out
  silently produces a period that never lines up with a month.
"""
type AccrualShape {
  """
    the grid the period snaps to, in months; null when the template's span is not a whole
    number of them and the period follows the payment around instead
  """
  months: Int
  "that free-floating span, in days; null when `months` says otherwise"
  days: Int
  "the day of the month a snapped period starts on"
  anchorDay: Int!
  "days from the start of a period to the payment for it, negative when paid in advance"
  phaseDays: Int!
  "what the example below is worked from: when the rule last fired, else now"
  exampleAt: DateTime!
  exampleFrom: DateTime!
  exampleTo: DateTime!
}

type AnalysisQuery {
  balance(date: DateTime, accountId: UUID!): ComputedBalance!
  balances(date: DateTime): [ComputedBalance!]!
  """
    The same computation as [`AnalysisQuery::balances`], repeated across a range.

    `stepDays` comes from the chart's visible range rather than being fixed, so zoomed out
    it lands around 30 and zoomed all the way in on 1. `to` is always the last sample even
    when the step does not divide the range, otherwise the line stops short of it.
  """
  history(from: DateTime!, to: DateTime!, stepDays: Int): History!
  """
    Expenses whose value is not yet fully consumed at `at`.

    The accrual period is what makes this work without the prepayment accounts and
    compensation flags MoneyDB needed: an expense whose money left on the transaction date
    but whose value is spread over a period is simply one with `accrualEnd > accrualStart`.
    The import derives such periods for the historical data rather than leaving everything
    degenerate, so this is populated straight after one.

    `isIncomplete` expenses are open items too, but with an unknown missing amount and so
    no remaining balance to compute; they come from `expenses.list` with a flag filter
    rather than from here.
  """
  prepayments(at: DateTime): [Prepayment!]!
  """
    Month-by-month income, spending and wealth across a range.

    `from` and `to` are snapped outwards to whole months, so asking for the middle of a
    month gives you that whole month rather than a fragment of one.

    Amounts are `calculatedAmount` — the movement on the account — rather than
    `effectiveAmount`. The totals have to reconcile with the balances, and those are
    account balances rather than ownership-weighted shares of them; mixing the two would
    make the integration error meaningless.
    `accrued` files each cost in the months it was *for* rather than the month it was
    paid, spread evenly over the days of its Leistungszeitraum. The balances stay where
    they are either way -- they are money in an account, which an accrued share is not --
    so `integratedEndTotal` comes back null and there is no integration error to report.
  """
  overviews(from: DateTime!, to: DateTime!, accrued: Boolean): Overviews!
  """
    One account's ledger over a range, as a bank statement reads it.

    Not the expense list with a filter: the computed opening balance, the expenses and the
    balances actually recorded are interleaved into one sequence, and a recorded balance
    re-anchors the running total. Where it disagrees with the total carried into it, the
    gap comes back as `drift` — that is the signal that an expense is missing.
  """
  statement(accountId: UUID!, from: DateTime!, to: DateTime!): [StatementEntry!]!
}

type AutomationRule {
  id: UUID!
  title: String!
  priority: Int!
  regexTime: String
  regexStatement: String
  filterAmount: Int
  filterAccountId: UUID
  lastDelivery: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  """
    null when the caller can no longer see the template, which means the rule cannot fire
    for them
  """
  templateId: UUID
  """
    null when the template is gone or pays with nothing, in which case the rule cannot fire
    anyway
  """
  accrual: AccrualShape
}

type AutomationRuleMutation {
  create(rule: AutomationRuleInput!): AutomationRule!
  update(id: UUID!, rule: AutomationRuleInput!): AutomationRule!
  delete(id: UUID!): Boolean!
}

type AutomationRuleQuery {
  """
    What a rule pointed at this template would do with a payment, before there is a rule to
    ask — the same derivation `AutomationRule.accrual` reports, so a template can be picked
    with its consequences visible.

    `at` is the payment to work the example from, and defaults to now.
  """
  preview(templateId: UUID!, accountId: UUID, at: DateTime): AccrualShape
  list(limit: Int, skip: Int, search: String, sortBy: AutomationRuleSortField, sortDir: SortDirection): [AutomationRule!]!
  get(id: UUID!): AutomationRule!
}

"""
  The accounts of one availability summed together.

  Per bucket rather than cumulative: stacking these gives the cumulative reading back as the
  height of the stack, whereas stacking cumulative series would count the liquid accounts
  once per level above them.
"""
type AvailabilitySeries {
  availability: AccountAvailability!
  amounts: [Float!]!
}

type Balance {
  id: UUID!
  upstreamId: UUID!
  comments: String!
  amount: Int!
  date: DateTime!
  account: Account!
}

type BalanceConnection {
  totalCount: Int!
  edges: [BalanceNode!]!
}

type BalanceMutation {
  delete(id: UUID!): Boolean!
  create(balance: BalanceInput!): Balance!
  update(id: UUID!, balance: BalanceInput!): Balance!
}

type BalanceNode {
  node: Balance!
}

type BalanceQuery {
  list(limit: Int, skip: Int, search: String, accountIds: [UUID!], after: DateTime, before: DateTime, sortBy: BalanceSortField, sortDir: SortDirection): BalanceConnection!
  get(id: UUID!): Balance!
}

type Category {
  id: UUID!
  """
    How often this category has been used in the last year, templates left out -- the same
    window and the same purpose as an account's.
  """
  usageCount: Int!
  name: String!
  description: String!
  color: String
  parent: Category
  "desired maximum spending per month, in cents"
  monthlyLimit: Int
}

"A category with the individual expenses behind it, for the treemap's inner level."
type CategoryBreakdown {
  category: Category
  income: Float!
  expenses: Float!
  """
    the biggest by absolute amount, so one call serves both the income and the spending
    view; a category holding both signs shows fewer of each
  """
  biggest: [CategoryExpense!]!
  "everything `biggest` left out, as one slice, so the treemap still sums to the total"
  restIncome: Float!
  restExpenses: Float!
}

type CategoryExpense {
  expenseId: UUID!
  title: String!
  "this expense's weighted share of the category, in cents"
  amount: Float!
}

type CategoryMutation {
  delete(id: UUID!): Boolean!
  create(category: CategoryInput!): Category!
  update(id: UUID!, category: CategoryInput!): Boolean!
}

type CategoryQuery {
  list(limit: Int, skip: Int, search: String, sortBy: CategorySortField, sortDir: SortDirection): [Category!]!
  get(id: UUID!): Category!
}

"""
  What one category absorbed over a period.

  An expense split across categories contributes its weighted share to each, so these sum to
  the period's total. `category` is null for the expenses that carry no categorization at
  all — dropping them would make the parts add up to less than the whole.
"""
type CategoryTotal {
  category: Category
  income: Float!
  expenses: Float!
}

type ComputedBalance {
  date: DateTime!
  amount: Float!
  reference: Balance!
  account: Account!
  expenseCount: Int!
}

type DeliveryMutation {
  """
    Hands bank statement lines to the automation rules.

    Safe to call with overlapping batches: a line already delivered is reported as a
    duplicate rather than creating a second expense.
  """
  submit(deliveries: [ExpenseDelivery!]!): [ExpenseDeliveryResult!]!
}

type DeliveryQuery {
  list(limit: Int, skip: Int, search: String, onlyUnmatched: Boolean, sortBy: DeliverySortField, sortDir: SortDirection): [SeenDelivery!]!
}

type Expense {
  id: UUID!
  upstreamId: UUID!
  title: String!
  store: String!
  description: String!
  comments: String!
  referenceAmount: Int
  accrualStart: DateTime!
  accrualEnd: DateTime!
  isTemplate: Boolean!
  isTaxRelevant: Boolean!
  isUnchecked: Boolean!
  isIncomplete: Boolean!
  isExtraordinary: Boolean!
  receipts: [ExpenseReceipt!]!
  categories: [ExpenseCategorization!]!
  transactions: [ExpenseTransaction!]!
  positions: [ExpensePosition!]!
  effectiveAmount: Float!
  changelog: [ExpenseChangelogEntry!]!
}

type ExpenseCategorization {
  category: Category!
  weight: Float!
}

"""
  One field a changelog entry changed.

  The values travel as JSON rather than as text the server wrote, because only the reader can
  say what they mean: the same `-17900` is money on a transaction, a weight on a
  categorization and an id on an account, and it is the browser that holds the locale, the
  account names and the formatting the rest of the app uses.
"""
type ExpenseChange {
  "`transactions/0/amount`"
  path: String!
  """
    Null where the field is absent on that side, which is how an added or removed list
    element arrives: one change carrying the whole element. A field that is present and
    null arrives as the JSON string `null`.
  """
  old: String
  new: String
}

type ExpenseChangelogConnection {
  """
    how many entries match, which for a caller that only wants the number is the whole
    answer: "3 Änderungen seit gestern" needs no entry to be read
  """
  totalCount: Int!
  edges: [ExpenseChangelogNode!]!
}

type ExpenseChangelogEntry {
  targetId: UUID!
  id: UUID!
  """
    The rendering a reader sees carries the upstream id, so this is the same value as
    `targetId`; it stays because the frontend keys its changelog rows on it.
  """
  expenseId: UUID!
  userId: UUID
  date: DateTime!
  tool: String
  automatic: Boolean!
  confidence: Float!
  oldState: ExpenseState
  newState: ExpenseState
  """
    What this entry changed, field by field. Empty for a creation, and for the entries an
    import writes: the export carries the expense as it is now rather than as it was, so
    `import.rs` stores the same state on both sides.
  """
  changes: [ExpenseChange!]!
  user: User
}

type ExpenseChangelogNode {
  node: ExpenseChangelogEntry!
}

type ExpenseConnection {
  totalCount: Int!
  edges: [ExpenseNode!]!
}

type ExpenseDeliveryResult {
  status: DeliveryStatus!
  ruleId: UUID
  message: String
  "the created expense, or null if the caller cannot see it"
  expenseId: UUID
}

type ExpenseMutation {
  delete(id: UUID!): Boolean!
  create(expense: ExpenseInput!): Expense!
  update(id: UUID!, expense: ExpenseInput!): Expense!
  """
    Runs the automation rules over an expense again, as though its bank line had only just
    arrived, and replaces it with what the matching rule produces.

    Everything the rule decides is overwritten -- title, categories, the other side of a
    split, the flags. What the bank said stays: the amount, the date and the statement are
    imposed back onto the template, exactly as they were on delivery. That is the whole
    point of the button: a rule fixed after the fact should be able to reach the expenses
    that were filed before it was.

    Nothing is recorded in `seen_deliveries`: the line was delivered once already, and a
    second record of it is what would make the next statement upload skip a real payment.
  """
  resort(id: UUID!): Expense!
}

type ExpenseNode {
  node: Expense!
}

type ExpensePosition {
  amount: Int
  quantity: Float
  unit: String
  title: String!
  comments: String!
}

type ExpenseQuery {
  list(limit: Int, skip: Int, search: String, ids: [UUID!], accountIds: [UUID!], categoryIds: [UUID!], flags: ExpenseFlagFilter, accruedAfter: DateTime, accruedBefore: DateTime, valuedAfter: DateTime, valuedBefore: DateTime, bookedAfter: DateTime, bookedBefore: DateTime, sortBy: ExpenseSortField, sortDir: SortDirection): ExpenseConnection!
  get(id: UUID!): Expense!
  changelog(limit: Int, skip: Int, author: ChangelogAuthor, since: DateTime): ExpenseChangelogConnection!
}

type ExpenseReceipt {
  uri: String!
  "can be a local file or e.g. a reference to a document in a dms"
  ocr: String
}

"""
  An expense with everything that belongs to it in one value.

  The tables store it across three relations, because the analysis groups by account, date
  and category. This shape is what the changelog remembers and what the importer builds;
  [`ExpenseRow`] and friends are what actually goes to the database.
  Named apart from the rendering the API otherwise serves: both are called `Expense` in Rust,
  and juniper let the two share one GraphQL name, so the SDL advertised the rendering's fields
  on a changelog state that does not have them.
"""
type ExpenseState {
  id: UUID!
  title: String!
  store: String!
  description: String!
  comments: String!
  "reference for fractional transactions, can be None if only fixed transactions are used"
  referenceAmount: Int
  accrualStart: DateTime!
  accrualEnd: DateTime!
  "set to true if this expense is only a stanza for a recurring expense; this means it will not be counted in any analysis"
  isTemplate: Boolean!
  "to track expenses that should be looked at again when preparing tax forms"
  isTaxRelevant: Boolean!
  "needs to be looked at by a user first (missing info, low confidence, ...)"
  isUnchecked: Boolean!
  "if we anticipate more transactions to appear before this can be completed; e.g. payback when a order hasn't arrived"
  isIncomplete: Boolean!
  "if this expense should not be considered for monthly spending and so on"
  isExtraordinary: Boolean!
  receipts: [ExpenseReceipt!]!
  categories: [ExpenseStateCategorization!]!
  transactions: [ExpenseStateTransaction!]!
  positions: [ExpensePosition!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ExpenseStateCategorization {
  categoryId: UUID!
  weight: Float!
}

type ExpenseStateTransaction {
  accountId: UUID!
  "when the money moved (Wertstellung)"
  date: DateTime!
  "when the bank posted the line, if it came from one at all"
  bookingDate: DateTime
  amount: Int
  fraction: Float
  comments: String!
  statement: String!
}

type ExpenseTransaction {
  account: Account!
  "when the money moved (Wertstellung)"
  date: DateTime!
  "when the bank posted the line; null for anything not delivered by one"
  bookingDate: DateTime
  amount: Int
  fraction: Float
  comments: String!
  statement: String!
  calculatedAmount: Float!
  effectiveAmount: Float!
}

type History {
  dates: [DateTime!]!
  byAccount: [AccountSeries!]!
  byAvailability: [AvailabilitySeries!]!
}

type MonthOverview {
  "midnight on the first of the month, UTC"
  month: DateTime!
  startTotal: Float!
  "what the recorded balances say at the end of the month"
  endTotal: Float!
  """
    `startTotal` plus everything booked during the month.

    The gap to `endTotal` is MoneyDB's *Integrationsfehler*. It does not mean the
    arithmetic drifted — it means an expense is missing, which is the whole point of
    showing it.

    Null when the totals are read on the accrual axis: a sixth of a subscription is a cost
    the month carried, not money that left an account, so there is nothing for the recorded
    balances to disagree with.
  """
  integratedEndTotal: Float
  income: Float!
  expenses: Float!
  expenseCount: Int!
  byAccount: [AccountOverview!]!
  byCategory: [CategoryTotal!]!
}

type Mutation {
  users: UserMutation!
  accounts: AccountMutation!
  balances: BalanceMutation!
  expenses: ExpenseMutation!
  categories: CategoryMutation!
  automationRules: AutomationRuleMutation!
  periodicRules: PeriodicRuleMutation!
  deliveries: DeliveryMutation!
}

type Overviews {
  months: [MonthOverview!]!
  "the whole range at once, for the treemap"
  byCategory: [CategoryBreakdown!]!
}

type PeriodicRule {
  id: UUID!
  title: String!
  period: PeriodicInterval!
  titleReplacement: String
  amountReplacement: Int
  lastCreation: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  "see `AutomationRule.templateId`"
  templateId: UUID
  "the instants this rule would generate expenses for on the next run"
  pending: [DateTime!]!
}

type PeriodicRuleMutation {
  create(rule: PeriodicRuleInput!): PeriodicRule!
  update(id: UUID!, rule: PeriodicRuleInput!): PeriodicRule!
  delete(id: UUID!): Boolean!
  """
    Generates every expense that is currently due from this user's own rules. The scheduled
    job covers everybody; this is the button for not waiting for it.
  """
  run: Int!
}

type PeriodicRuleQuery {
  list(limit: Int, skip: Int, search: String, sortBy: PeriodicRuleSortField, sortDir: SortDirection): [PeriodicRule!]!
  get(id: UUID!): PeriodicRule!
}

"What is left of an expense whose value is still being consumed at the requested date."
type Prepayment {
  expense: Expense!
  "how much of the accrual period has elapsed, 0..1"
  consumedFraction: Float!
  "cents not yet consumed, in the same sign as the expense itself"
  remaining: Float!
}

type Query {
  apiVersion: String!
  users: UserQuery!
  accounts: AccountQuery!
  balances: BalanceQuery!
  expenses: ExpenseQuery!
  categories: CategoryQuery!
  analysis: AnalysisQuery!
  automationRules: AutomationRuleQuery!
  periodicRules: PeriodicRuleQuery!
  deliveries: DeliveryQuery!
}

type SeenDelivery {
  id: UUID!
  accountId: UUID!
  date: DateTime!
  amount: Int!
  statement: String!
  createdAt: DateTime!
  "false when no rule matched, which is the signal that a rule is missing"
  matched: Boolean!
  "the expense this delivery produced, or null if the caller cannot see it"
  expenseId: UUID
}

type StatementEntry {
  kind: StatementEntryKind!
  date: DateTime!
  title: String!
  store: String!
  expenseId: UUID
  "this account's share, in cents; null on the rows that only assert a balance"
  amount: Float
  "running total, re-anchored whenever a recorded balance disagrees with it"
  balance: Float!
  """
    on a recorded balance, what it says minus what was carried into it. A non-zero value
    is the signal that an expense is missing.
  """
  drift: Float
}

type User {
  id: UUID!
  name: String!
  fullName: String!
  firstName: String
  lastName: String
}

type UserMutation {
  login(name: String!, password: String!): User!
  """
    Records that the reader is here, and says when they were here before.

    A mutation because it writes, but it is what the start page opens with: it needs the
    previous visit to date its news from, and that answer stops being available the moment
    this one is recorded.
  """
  visit: Visit!
  logout: Boolean!
}

type UserQuery {
  me: User!
  get(id: UUID!): User!
  list(limit: Int, skip: Int): [User!]!
}

"""
  When the reader was last here, and when they were here before that.

  `previous` is what a start page dates its news from: null on a first visit, which the
  reader has no history to be told about anyway.
"""
type Visit {
  current: DateTime!
  previous: DateTime
}

