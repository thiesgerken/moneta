<!-- The favicon with the coin rim added back: it muddies the 16px rendering but is what makes
     the mark a coin rather than a lettered dot at header size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Moneta">
  <circle cx="16" cy="16" r="15" fill="#ef562f" />
  <circle cx="16" cy="16" r="12.2" fill="none" stroke="#fff" stroke-width="1" opacity="0.45" />
  <path
    d="M9 21.5 V11.5 L16 18 L23 11.5 V21.5"
    fill="none"
    stroke="#fff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
