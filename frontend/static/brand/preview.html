<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="robots" content="noindex" />
		<title>Moneta · Markenübersicht</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f9fafb;
				color: #111827;
				font:
					16px/1.5 system-ui,
					sans-serif;
			}
			main {
				max-width: 960px;
				margin: auto;
				padding: 48px 24px;
			}
			h1 {
				margin: 0;
				font:
					600 32px/1.2 Georgia,
					serif;
			}
			p {
				margin: 12px 0 32px;
				color: #6b7280;
				max-width: 64ch;
			}
			h2 {
				margin: 0 0 24px;
				font-size: 14px;
				font-weight: 500;
			}
			section {
				padding: 40px;
				background: #fff;
				border-radius: 16px;
			}
			.pair {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
				margin-bottom: 20px;
			}
			.dark {
				background: #111827;
				color: #f9fafb;
			}
			.dark h2 {
				color: #d1d5db;
			}
			.lockup {
				display: block;
				width: 100%;
				height: auto;
			}
			.samples {
				display: flex;
				align-items: center;
				gap: 28px;
				margin-top: 40px;
			}
			figure {
				margin: 0;
				text-align: center;
			}
			figure img {
				display: block;
				margin: 0 auto 12px;
			}
			figcaption {
				color: #6b7280;
				font-size: 12px;
			}
			.dark figcaption {
				color: #9ca3af;
			}
			.lettering {
				display: block;
				width: min(100%, 560px);
				height: auto;
			}
			.downloads {
				display: flex;
				flex-wrap: wrap;
				gap: 16px 24px;
				margin-top: 24px;
			}
			a {
				color: #a5371b;
				text-underline-offset: 4px;
			}
			a:focus-visible {
				outline: 2px solid #111827;
				outline-offset: 5px;
			}
			@media (max-width: 700px) {
				main {
					padding: 24px 16px;
				}
				.pair {
					grid-template-columns: 1fr;
				}
				section {
					padding: 28px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Ein gemeinsames Buch.</h1>
			<p>
				Zwei Seiten, eine Mitte. Ein offenes Haushaltsbuch als Zeichen für das, was Moneta
				zusammenbringt.
			</p>
			<div class="pair">
				<section aria-labelledby="primary">
					<h2 id="primary">Zeichen und Wortmarke</h2>
					<img
						class="lockup"
						src="lockup.svg"
						alt="Moneta: orangefarbenes, offenes Buch neben der Wortmarke moneta"
						width="296"
						height="64"
					/>
					<div class="samples" aria-label="Zeichen in kleinen Größen">
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 16 Pixel" width="16" height="16" />
							<figcaption>16 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 24 Pixel" width="24" height="24" />
							<figcaption>24 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 32 Pixel" width="32" height="32" />
							<figcaption>32 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 48 Pixel" width="48" height="48" />
							<figcaption>48 px</figcaption>
						</figure>
					</div>
				</section>
				<section class="dark" aria-labelledby="dark">
					<h2 id="dark">Auf dunklem Grund</h2>
					<img
						class="lockup"
						src="lockup-dark.svg"
						alt="Orangefarbenes Moneta-Zeichen mit weißer Wortmarke"
						width="296"
						height="64"
					/>
					<div class="samples" aria-label="Zeichen auf dunklem Grund">
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 16 Pixel" width="16" height="16" />
							<figcaption>16 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 24 Pixel" width="24" height="24" />
							<figcaption>24 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 32 Pixel" width="32" height="32" />
							<figcaption>32 px</figcaption>
						</figure>
						<figure>
							<img src="mark.svg" alt="Moneta-Zeichen, 48 Pixel" width="48" height="48" />
							<figcaption>48 px</figcaption>
						</figure>
					</div>
				</section>
			</div>
			<section aria-labelledby="wordmark">
				<h2 id="wordmark">Die Wortmarke</h2>
				<img
					class="lettering"
					src="wordmark.svg"
					alt="moneta in Source Serif 4"
					width="216"
					height="64"
				/>
				<nav class="downloads" aria-label="Grafikdateien">
					<a href="mark.svg" download>Zeichen als SVG</a>
					<a href="wordmark.svg" download>Wortmarke als SVG</a>
					<a href="lockup.svg" download>Kombination als SVG</a>
					<a href="lockup-dark.svg" download>Dunkle Variante als SVG</a>
					<a href="mark-512.png" download>Zeichen als PNG</a>
					<a href="lockup-1200.png" download>Kombination als PNG</a>
				</nav>
			</section>
		</main>
	</body>
</html>
