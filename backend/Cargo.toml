[package]
name = "moneta"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2024"
default-run = "moneta"

[dependencies]
argon2 = "0.5"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["cargo"] }
config = "0.15"
itertools = "0.15"
log = "0.4"
prettytable-rs = "0.10"
regex = "1.13"
rocket = { version = "0.5.1", features = ["secrets", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
tokio = { version = "1", features = ["full"] }
mongodb = { version = "3.8", default-features = false, features = [
    "bson-3",
    "compat-3-3-0",
    "rustls-tls",
    "dns-resolver",
] }
dataloader = { version = "0.18", default-features = false, features = [
    "runtime-tokio",
] }
juniper = { version = "0.17", features = ["chrono"] }
juniper_rocket = "0.10"
dotenvy = "0.15"
bson = { version = "3.1", features = ["chrono-0_4"] }
rocket_cors = "0.6.0"
similar = "3.1"

[profile.release]
lto = true
