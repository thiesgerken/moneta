[package]
name = "moneta"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2024"
default-run = "moneta"

[dependencies]
argon2 = "0.6"
futures = "0.3"
base64 = "0.22"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["cargo"] }
config = "0.15"
itertools = "0.15"
log = "0.4"
prettytable-rs = "0.10"
regex = "1.13"
# The only thing moneta calls out to is stockdb, and that needs a GET with a bearer token and
# nothing else: no cookies, no proxy handling, no forms. rustls rather than the system openssl,
# so the runtime image stays as slim as it is.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rocket = { version = "0.5.1", features = ["secrets", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
simplelog = "0.12"
tokio = { version = "1", features = ["full"] }
diesel = { version = "2.3", features = [
    "chrono",
    "postgres_backend",
    "serde_json",
    "uuid",
] }
diesel-async = { version = "0.9", features = [
    "async-connection-wrapper",
    "deadpool",
    "migrations",
    "postgres",
] }
diesel_migrations = "2.3"
# Direct, only for `Runtime`: diesel-async re-exports deadpool's Pool and PoolBuilder as type
# aliases but not the runtime enum, and a pool without one refuses to take a wait timeout.
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
uuid = { version = "1", features = ["v7", "serde"] }
dataloader = { version = "0.18", default-features = false, features = [
    "runtime-tokio",
] }
# schema-language is what `moneta schema` prints; without it the SDL has to come from a
# running server, which means a database, to regenerate a file that depends on neither
juniper = { version = "0.17", features = ["chrono", "schema-language", "uuid"] }
juniper_rocket = "0.10"
dotenvy = "0.15"
rocket_cors = "0.6.0"
chrono-tz = "0.10.4"

[profile.release]
lto = true
