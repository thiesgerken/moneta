services:
  backend:
    build:
      context: ./backend
    image: git.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - MONETA__DATABASE__URL=mongodb://mongo:27017
      - MONETA__API__PORT=80
      - MONETA__API__ADDRESS=0.0.0.0
      - MONETA__API__SECRET_KEY=M7/dfyV00H6WoOGNxygzdOudibhuPdQwJay5pi+I1cg=
    command: moneta serve
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-backend.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.moneta-backend.entrypoints=web"

  frontend:
    deploy:
      replicas: 1
    build:
      context: ./frontend
    image: git.gerken.haus/thies/moneta/frontend:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - GRAPHQL_API_URL=http://backend:80/graphql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.moneta-frontend.entrypoints=web"

  mongo:
    image: mongo:8@sha256:7d1a1a613b41523172dc2b1b02c706bc56cee64144ccd6205b1b38703c85bf61
    volumes:
      - ./volumes/mongo:/data/db
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:27018:27017"

  traefik:
    image: "traefik:v3.5@sha256:f0abbbd11ced29754d4d188c29e9320b613481ec162b6ea5d3a8b6bdd8e5fa54"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8485:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  mongo:
