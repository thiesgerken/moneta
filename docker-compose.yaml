services:
  backend:
    build:
      context: ./backend
    image: gitea.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    expose:
      - 80
    ports:
      # The port `cargo run -- serve` uses, so that `pnpm dev` reaches whichever of the two
      # backends is running without being reconfigured. They cannot both have it.
      - "127.0.0.1:8181:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MONETA__DATABASE__URL=postgres://moneta:moneta@postgres:5432/moneta
      - MONETA__API__PORT=80
      - MONETA__API__ADDRESS=0.0.0.0
      - MONETA__API__SECRET_KEY=M7/dfyV00H6WoOGNxygzdOudibhuPdQwJay5pi+I1cg=
      # There is no stockdb in this stack, so the depots are read from the deployed one. That
      # needs a token per user, which is not in here and cannot be: `moneta user
      # --stockdb-token <name>` sets it, `stockdb user --token <name>` issues it, and it only
      # reads. Blank either of these and the integration switches itself off.
      - MONETA__STOCKDB__URL=https://stocks.gerken.haus
      - MONETA__STOCKDB__PUBLIC_URL=https://stocks.gerken.haus
    command: moneta serve
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-backend.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.moneta-backend.entrypoints=web"

  # In production this is a scheduled job rather than a service; here it is a sidecar so the
  # compose stack exercises the same command. Generation is idempotent, so the interval only
  # decides how soon a due expense appears.
  periodic:
    build:
      context: ./backend
    image: gitea.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MONETA__DATABASE__URL=postgres://moneta:moneta@postgres:5432/moneta
    command: sh -c 'while true; do moneta periodic --run; sleep 3600; done'

  frontend:
    deploy:
      replicas: 1
    build:
      context: ./frontend
    image: gitea.gerken.haus/thies/moneta/frontend:main
    restart: unless-stopped
    expose:
      - 80
    ports:
      # Alongside traefik on 8485 rather than instead of it: this one reaches the container
      # directly, which is what you want when the question is whether the frontend or the proxy
      # in front of it is at fault. 8180 to sit next to the backend's 8181.
      #
      # It is a fixed host port, so `replicas` above has to stay at 1.
      - "127.0.0.1:8180:80"
    environment:
      - GRAPHQL_API_URL=http://backend:80/graphql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.moneta-frontend.entrypoints=web"

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      # The 18 image defaults PGDATA to /var/lib/postgresql/18/docker, outside the mount,
      # and then refuses to start because the mount looks like a stray data directory.
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=moneta
      - POSTGRES_PASSWORD=moneta
      - POSTGRES_DB=moneta
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneta"]
      interval: 5s
      retries: 10

  traefik:
    image: "traefik:v3.7@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8485:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  postgres:
