services:
  backend:
    build:
      context: ./backend
    image: git.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - MONETA__DATABASE__URL=mongodb://mongo:27017
      - MONETA__API__PORT=80
      - MONETA__API__ADDRESS=0.0.0.0
      - MONETA__API__SECRET_KEY=M7/dfyV00H6WoOGNxygzdOudibhuPdQwJay5pi+I1cg=
    command: moneta serve
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-backend.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.moneta-backend.entrypoints=web"

  frontend:
    deploy:
      replicas: 1
    build:
      context: ./frontend
    image: git.gerken.haus/thies/moneta/frontend:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - GRAPHQL_API_URL=http://backend:80/graphql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.moneta-frontend.entrypoints=web"

  mongo:
    image: mongo:8@sha256:bf41aa48a1cc0ccc8e6071236acfc428b7110ec2cf14b47c8961bc472e2c7c61
    volumes:
      - ./volumes/mongo:/data/db
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:27018:27017"

  traefik:
    image: "traefik:v3.5@sha256:602b5fdf0ad07e6ca79609b3161e0da52da2c9d70840961d861b4687f5704c7c"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8485:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  mongo:
