version: "3.3"
services:
  backend:
    build:
      context: .
    image: git.thiesgerken.de:5005/thies/moneta:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - MONETA__DATABASE__URL=mongodb://mongo:27017
      - MONETA__API__PORT=80
      - MONETA__API__ADDRESS=0.0.0.0
      - MONETA__API__SECRET_KEY=M7/dfyV00H6WoOGNxygzdOudibhuPdQwJay5pi+I1cg=
    command: moneta serve
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-backend.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.moneta-backend.entrypoints=web"

  frontend:
    build:
      context: ../moneta-frontend
    image: git.thiesgerken.de:5005/thies/moneta-frontend:main
    restart: unless-stopped
    expose:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.moneta-frontend.entrypoints=web"

  mongo:
    image: mongo:5
    volumes:
      - mongo:/data/db
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:27018:27017"

  traefik:
    image: "traefik:v2.9"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8485:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  mongo:
