services:
  backend:
    build:
      context: ./backend
    image: git.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MONETA__DATABASE__URL=postgres://moneta:moneta@postgres:5432/moneta
      - MONETA__DATABASE__MONGO_URL=mongodb://mongo:27017
      - MONETA__API__PORT=80
      - MONETA__API__ADDRESS=0.0.0.0
      - MONETA__API__SECRET_KEY=M7/dfyV00H6WoOGNxygzdOudibhuPdQwJay5pi+I1cg=
    command: moneta serve
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-backend.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.moneta-backend.entrypoints=web"

  # In production this is a scheduled job rather than a service; here it is a sidecar so the
  # compose stack exercises the same command. Generation is idempotent, so the interval only
  # decides how soon a due expense appears.
  periodic:
    build:
      context: ./backend
    image: git.gerken.haus/thies/moneta/backend:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MONETA__DATABASE__URL=postgres://moneta:moneta@postgres:5432/moneta
      - MONETA__DATABASE__MONGO_URL=mongodb://mongo:27017
    command: sh -c 'while true; do moneta periodic --run; sleep 3600; done'

  frontend:
    deploy:
      replicas: 1
    build:
      context: ./frontend
    image: git.gerken.haus/thies/moneta/frontend:main
    restart: unless-stopped
    expose:
      - 80
    environment:
      - GRAPHQL_API_URL=http://backend:80/graphql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moneta-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.moneta-frontend.entrypoints=web"

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=moneta
      - POSTGRES_PASSWORD=moneta
      - POSTGRES_DB=moneta
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneta"]
      interval: 5s
      retries: 10

  # Only needed until the postgres cutover is done; `moneta migrate-mongo` reads from here.
  mongo:
    image: mongo:8@sha256:d6566e93e6a913cdb622ebe34e0ae7937d50efa60e92363fb4a84404dc890415
    volumes:
      - ./volumes/mongo:/data/db
    restart: unless-stopped
    ports:
      # for debugging :)
      - "127.0.0.1:27018:27017"

  traefik:
    image: "traefik:v3.5@sha256:16acb89c6db341182970d6fdafece31303b0a380a8ed7aa51682e225229bf1d2"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8485:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  mongo:
  postgres:
