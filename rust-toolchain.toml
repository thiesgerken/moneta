# The one Rust toolchain: the dev shell, CI (which runs inside the dev shell) and the backend
# image all build with it through rust-overlay in flake.nix, and rustup honours it too. Without a
# pin, every stable release that promotes a new clippy lint turns main red on its own schedule --
# renovate offers the bump as a reviewable PR instead.
[toolchain]
channel = "1.100.0"
# llvm-tools is what cargo-llvm-cov needs to read the instrumented profiles.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
profile = "minimal"
