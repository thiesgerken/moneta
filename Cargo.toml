[package]
name = "moneydb"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "moneydb"

[dependencies]
argonautica = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = "2.33"
config = "0.10"
diesel = { version = "1.4", features = ["postgres", "chrono"] }
diesel-derive-enum = { version = "1.0", features = ["postgres"] }
diesel_migrations = "1.4"
log = "0.4"
prettytable-rs = "0.8"
# rocket = { git = "https://github.com/SergioBenitez/Rocket"}
# rocket_contrib = { git = "https://github.com/SergioBenitez/Rocket", features = ["diesel_postgres_pool"] }
# rocket = "0.4"
# rocket_contrib = { version = "0.4", features = ["diesel_postgres_pool"] }
# rust-embed = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.8"
toml = "0.5"
# futures = "0.3"
# tokio = { version = "0.2", features= ["macros"] }
# itertools = "0.9"

[profile.release]
lto = true
