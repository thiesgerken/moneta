[package]
name = "moneta"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2024"
default-run = "moneta"

[dependencies]
async-trait = "0.1"
argonautica = "0.2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["cargo"] }
config = "0.15"
itertools = "0.14"
log = "0.4"
prettytable-rs = "0.10"
regex = "1.11"
rocket = { version = "0.5.1", features = ["secrets", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
toml = "0.8"
tokio = { version = "1.45", features = ["full"] }
mongodb = "3.2"
dataloader = { version = "0.18", default-features = false, features = [
    "runtime-tokio",
] }
juniper = {version = "0.16.1", features = ["chrono"]}
juniper_rocket = "0.9.0"
dotenv = "0.15.0"
bson = { version = "2.15.0", features = ["chrono-0_4", "serde_with"] }

[profile.release]
lto = true
