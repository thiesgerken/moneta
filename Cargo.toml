[package]
name = "moneta"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "moneta"

[dependencies]
argonautica = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap ={ version = "3.0", features = ["cargo"] }
clap_complete = "3.0"
config = "0.11"
diesel = { version = "1.4", features = ["postgres", "chrono"] }
diesel_migrations = "1.4"
diesel-derive-enum = { version = "1.1", features = ["postgres"] }
itertools = "0.10"
log = "0.4"
prettytable-rs = "0.8"
regex = "1.4"
rocket = { version = "0.5.0-rc.1", features = ["secrets", "json"] }
rocket_sync_db_pools = { version = "0.1.0-rc.1", features = ["diesel_postgres_pool"]}
rust-embed = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.11"
toml = "0.5"
tokio = { version = "1.0", features= ["full"] } # needs to be synced to the version rocket uses!

[dev-dependencies]
criterion = "0.3"

[profile.release]
lto = true

[[bench]]
name = "rendering"
harness = false
