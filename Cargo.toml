[package]
name = "moneta"
version = "3.0.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2021"
default-run = "moneta"

[dependencies]
argonautica = "0.2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "3.0", features = ["cargo"] }
config = "0.13"
itertools = "0.10"
log = "0.4"
prettytable-rs = "0.9"
regex = "1.4"
schemars ={ version =  "0.8", features = ["chrono"]}
rocket = { version = "0.5.0-rc.1", features = ["secrets", "json"] }
rocket_okapi = { version = "0.8.0-rc.1", features = ["rapidoc", "swagger", "secrets"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
toml = "0.5"
tokio = { version = "1.0", features = [
    "full"
] } # needs to be synced to the version rocket uses!
mongodb = { version = "2.2.0", features = [
    "bson-chrono-0_4",
    "bson-serde_with"
] }

[profile.release]
lto = true

